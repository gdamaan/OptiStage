name: OptiStage Backend CI

# Les Déclencheurs : Le pipeline s'active quand on pousse sur ces branches
on:
  push:
    branches: [ "main", "test", "dev" ]
  pull_request:
    branches: [ "main", "test" ]

jobs:
  build:
    runs-on: ubuntu-latest # Le système alloue un serveur virtuel Linux vierge

    steps:
    # 1. On récupère votre code source depuis le dépôt
    - name: Extraction du code (Checkout)
      uses: actions/checkout@v3

    # 2. On installe la forge Java
    - name: Configuration de l'environnement Java
      uses: actions/setup-java@v3
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven 

    # 3. NOUVEAU : Exécution stricte des bancs d'essai (JUnit & Mockito)
    - name: Lancement des tests unitaires et d'intégration
      run: mvn test

    # 4. On allume le réacteur et on forge le JAR (uniquement si l'étape 3 a réussi)
    - name: Compilation Maven et Création du Fat JAR
      run: mvn package -DskipTests 
      # (On peut skipper ici car la commande 'mvn test' vient juste de les exécuter)
